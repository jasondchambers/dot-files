# Synthwave lock screen
#   pink   = rgb(ff2a6d)
#   cyan   = rgb(05d9e8)
#   purple = rgb(b967ff)
#   night  = rgb(1a1033)

$font = MesloLGS Nerd Font
$pink = rgb(ff2a6d)
$cyan = rgb(05d9e8)
$purple = rgb(b967ff)

general {
    hide_cursor = true
    ignore_empty_input = true
}

animations {
    enabled = true
    bezier = easeOut, 0.16, 1, 0.3, 1
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 6, easeOut
    animation = fadeOut, 1, 6, easeOut
    animation = inputFieldDots, 1, 3, easeOut
    animation = inputFieldColors, 1, 4, linear
    animation = inputFieldWidth, 1, 4, easeOut
}

# Frosted, darkened snapshot of whatever was on screen
background {
    monitor =
    path = screenshot
    color = rgb(1a1033)
    blur_passes = 4
    blur_size = 8
    noise = 0.02
    contrast = 1.1
    brightness = 0.45
    vibrancy = 0.4
    vibrancy_darkness = 0.2
}

# ---- Clock (stacked hours / minutes) ----
label {
    monitor =
    text = cmd[update:1000] date +"%H"
    color = $pink
    font_size = 150
    font_family = $font Bold
    shadow_passes = 3
    shadow_size = 6
    shadow_color = rgba(ff2a6daa)
    position = 0, 290
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] date +"%M"
    color = $cyan
    font_size = 150
    font_family = $font Bold
    shadow_passes = 3
    shadow_size = 6
    shadow_color = rgba(05d9e8aa)
    position = 0, 110
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:60000] date +"%A · %B %-d" | tr '[:lower:]' '[:upper:]'
    color = rgba(ffffffcc)
    font_size = 18
    font_family = $font
    position = 0, 0
    halign = center
    valign = center
}

# Rotating tagline (changes every minute)
label {
    monitor =
    text = cmd[update:60000] set -- "the grid awaits" "jack back in" "systems nominal" "stay rad" "neon never sleeps" "rewind · replay · resume" "insert coin to continue" "welcome to the future"; shift $(( $(date +%-M) % $## )); echo "<i>— $1 —</i>"
    color = $purple
    font_size = 14
    font_family = $font
    position = 0, -40
    halign = center
    valign = center
}

# ---- Avatar-ish glyph + greeting ----
label {
    monitor =
    text = 󰀄
    color = $cyan
    font_size = 34
    font_family = $font
    shadow_passes = 2
    shadow_color = rgba(05d9e888)
    position = 0, -120
    halign = center
    valign = center
}

label {
    monitor =
    text = Hey, <b>$USER</b>
    color = rgba(ffffffee)
    font_size = 16
    font_family = $font
    position = 0, -170
    halign = center
    valign = center
}

# ---- Password field ----
input-field {
    monitor =
    size = 340, 56
    outline_thickness = 3
    rounding = -1
    dots_size = 0.25
    dots_spacing = 0.35
    dots_center = true
    dots_rounding = -1

    outer_color = $pink $purple $cyan 45deg
    inner_color = rgba(1a1033cc)
    font_color = $cyan
    check_color = $cyan $purple 120deg
    fail_color = rgb(ff0055) rgb(ff7700) 40deg
    capslock_color = rgb(ffd319) rgb(ff901f) 90deg

    fade_on_empty = false
    placeholder_text = <span foreground="##b967ff"><i>󰌾  enter the grid…</i></span>
    fail_text = <b>ACCESS DENIED</b> <i>($ATTEMPTS)</i>
    check_text = <i>authenticating…</i>
    font_family = $font

    shadow_passes = 3
    shadow_size = 8
    shadow_color = rgba(b967ff66)

    position = 0, -240
    halign = center
    valign = center
}

# ---- Now playing (hidden when nothing is playing) ----
label {
    monitor =
    text = cmd[update:2000] out=$(playerctl metadata --format '󰎆  \{{artist}} — \{{title}}' 2>/dev/null | sed 's/&/\&amp;/g; s/</\&lt;/g'); [ -n "$out" ] && echo "$out" || printf '\342\200\213'
    color = rgba(ffffffaa)
    font_size = 13
    font_family = $font
    position = 0, 60
    halign = center
    valign = bottom
}

# ---- Corner stats ----
label {
    monitor =
    text = cmd[update:60000] echo "󰌢  $(hostname)   $(uptime -p)"
    color = rgba(05d9e8bb)
    font_size = 12
    font_family = $font
    position = 30, 30
    halign = left
    valign = bottom
}

label {
    monitor =
    text = 󰌌  $LAYOUT
    color = rgba(ff2a6dbb)
    font_size = 12
    font_family = $font
    position = -30, 30
    halign = right
    valign = bottom
}
